<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catcher Game - 90s Arcade</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #141419;
            color: #e9c46a;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
git
        h1 {
            font-size: 3.8rem;
            font-weight: 900;
            color: #70d6ff;
            text-transform: uppercase;
            letter-spacing: 6px;

            text-shadow: 2px 2px 0px #0077b6,
                4px 4px 0px #f4a261,
                6px 6px 0px #141419,
                8px 8px 12px rgba(0, 0, 0, 0.7);

            margin-top: 25px;
            margin-bottom: 45px;

        }

        /*Pelin kehys*/
        .arcade-capinet {
            position: relative;
            padding: 12px;
            background: #1c1c24;
            border: 3px solid #e9c46a;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(233, 196, 106, 0.2);
        }

        #gameCanvas {
            display: block;
            width: 800px;
            height: 640px;
            image-rendering: pixelated;
            border: 2px solid #f4a261;
        }

        .ohjeet {
            margin-top: 15px;
            color: #a0a0b0;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <h1>RETRO CATCHER '90</h1>

    <div class="arcade-capinet">
        <canvas id="gameCanvas" width="400" height="320"></canvas>
    </div>

    <p class="ohjeet">NÄPPÄIMET: Vasen nuoli / Oikea nuoli | Uusi peli: Välilyönti</p>

    <script src="game.js"> </script>
</body>

</html>
